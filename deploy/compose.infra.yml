name: elder-companion-dev

# Development database only. Apply the schema with backend Alembic migrations.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.local}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion_dev -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
