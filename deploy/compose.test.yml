name: elder-companion-tests
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: companion_test
      POSTGRES_USER: companion_dev
      POSTGRES_PASSWORD: companion-test-local-only
      TZ: UTC
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15484}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion_dev -d companion_test"]
      interval: 2s
      timeout: 3s
      retries: 30
