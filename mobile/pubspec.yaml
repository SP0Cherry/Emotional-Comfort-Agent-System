  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
