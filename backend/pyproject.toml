[project]
name = "companion-agent"
version = "0.1.0"
description = "Private, traceable AI companion API and durable PostgreSQL worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "cryptography>=44,<47",
  "Pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
